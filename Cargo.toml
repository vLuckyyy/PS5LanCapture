[package]
name = "ps5-lan-capture"
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Mirror PS5 video and audio to your PC over LAN (PS Remote Play) so you can share it on Discord"
publish = false

[dependencies]
base64 = "0.22"
cpal = "0.18"
egui = { version = "0.35", default-features = false, features = ["default_fonts"] }
egui-directx11 = "0.13"
egui-winit = { version = "0.35", default-features = false, features = ["clipboard", "links"] }
hidapi = "2.6.7"
image = { version = "0.25", default-features = false, features = ["png"] }
log = { version = "0.4", features = ["std"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Networking_WinHttp",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winit = "0.30"

[build-dependencies]
cmake = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
linker_messages = "allow"
